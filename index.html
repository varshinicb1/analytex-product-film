<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030508">
<title>AnalyteX — One Device. Every Threat. | VidyuthLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #030508;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  canvas { display: block; }

  /* ── PROGRESS BAR ── */
  #prog {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 20;
    background: linear-gradient(90deg, #00e5ff, #0080ff);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.1s linear;
    box-shadow: 0 0 8px rgba(0,229,255,0.6);
  }

  /* ── HUD BRANDING ── */
  #hud {
    position: fixed; left: 28px; top: 24px; z-index: 15;
    color: #00e5ff; font-family: 'Outfit', sans-serif; font-weight: 700;
    letter-spacing: 4px; font-size: 12px; opacity: 0.9;
    text-shadow: 0 0 20px rgba(0,229,255,0.4);
    pointer-events: none;
  }

  /* ── CHAPTER OVERLAY ── */
  #ch-overlay {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; z-index: 12;
    opacity: 0; transition: opacity 0.6s ease;
    padding: 48px 56px;
    border-radius: 24px;
    /* Cinematic scrim: dark dim behind the text */
    background: radial-gradient(ellipse at 50% 50%, rgba(2,6,14,0.72) 0%, rgba(2,6,14,0.55) 60%, transparent 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    min-width: 480px;
    max-width: 80vw;
  }
  #ch-overlay.visible { opacity: 1; }
  #ch-title {
    font-family: 'Outfit', sans-serif; font-weight: 900;
    font-size: clamp(32px, 7vw, 80px);
    color: #fff;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ffffff 40%, #8ab4d0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 40px rgba(0,229,255,0.25)) drop-shadow(0 2px 12px rgba(0,0,0,0.8));
    line-height: 1.1;
  }
  #ch-sub {
    font-family: 'Outfit', sans-serif; font-weight: 600;
    font-size: clamp(12px, 2.5vw, 18px);
    color: #00e5ff; letter-spacing: 5px; margin-top: 14px;
    opacity: 0.9;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  /* ── SUBTITLE BAR ── */
  #cap {
    position: fixed;
    left: 50%; bottom: max(env(safe-area-inset-bottom, 20px), 7%);
    transform: translateX(-50%);
    text-align: center;
    color: #f0f4f8;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 2.2vw, 22px);
    font-weight: 500;
    line-height: 1.55;
    max-width: min(860px, 88vw);
    width: 88%;
    background: rgba(8, 14, 24, 0.55);
    backdrop-filter: blur(16px) saturate(1.5);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid rgba(0, 229, 255, 0.1);
    border-radius: 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset;
    padding: 14px 28px;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 8;
  }

  /* ── REPLAY BUTTON ── */
  #replay {
    position: fixed; right: max(env(safe-area-inset-right, 24px), 24px);
    bottom: max(env(safe-area-inset-bottom, 24px), 24px);
    background: rgba(10, 16, 26, 0.8);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #c7d0da;
    border: 1px solid rgba(0, 229, 255, 0.18);
    font-family: 'Outfit', sans-serif; font-weight: 600;
    font-size: 13px; letter-spacing: 1.5px;
    padding: 10px 22px; border-radius: 999px;
    cursor: pointer; opacity: 0;
    transition: opacity 0.4s, background 0.2s, color 0.2s, border-color 0.2s;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4); z-index: 15;
  }
  #replay:hover {
    background: rgba(0,229,255,0.12);
    color: #fff; border-color: rgba(0,229,255,0.5);
  }

  /* ── START OVERLAY ── */
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px;
    background: radial-gradient(ellipse at 50% 42%, #0b1829 0%, #050a12 55%, #020508 100%);
    z-index: 20; transition: opacity 0.9s ease;
  }
  .start-eyebrow {
    font-family: 'Outfit', sans-serif; font-weight: 700;
    letter-spacing: 6px; font-size: clamp(10px, 1.5vw, 14px);
    color: #00e5ff; opacity: 0.85; margin-bottom: 14px;
  }
  .start-title {
    font-family: 'Outfit', sans-serif; font-weight: 900;
    font-size: clamp(52px, 12vw, 104px);
    letter-spacing: -2px; line-height: 1;
    background: linear-gradient(170deg, #ffffff 40%, #6fa8c9 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 60px rgba(0,229,255,0.08));
  }
  .start-rule {
    width: 48px; height: 1.5px; margin: 22px 0;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
  }
  .start-desc {
    font-family: 'Inter', sans-serif; font-weight: 400;
    color: #8a9aaa; font-size: clamp(14px, 2vw, 18px);
    text-align: center; max-width: 440px; line-height: 1.65;
    margin-bottom: 42px;
  }
  #play {
    position: relative;
    background: linear-gradient(135deg, #b8860b 0%, #ffd700 28%, #fffacd 50%, #f0c040 70%, #c8960c 85%, #8b6914 100%);
    color: #1a0a00;
    border: none;
    font-family: 'Outfit', sans-serif; font-weight: 700;
    font-size: clamp(15px, 2vw, 18px); letter-spacing: 2.5px;
    padding: 18px 58px; border-radius: 999px;
    cursor: pointer;
    box-shadow:
      0 0 0 1px rgba(255,215,0,0.55),
      0 0 0 3px rgba(184,134,11,0.2),
      0 6px 32px rgba(255,200,0,0.40),
      0 2px 8px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.25);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), box-shadow 0.28s, filter 0.28s;
    overflow: hidden;
  }
  #play::before {
    content: '';
    position: absolute; inset: 0; border-radius: 999px;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%);
    background-size: 200% 100%;
    animation: goldShimmer 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes goldShimmer {
    0%   { background-position: 200% 0; }
    60%  { background-position: -200% 0; }
    100% { background-position: -200% 0; }
  }
  #play:hover {
    transform: scale(1.05);
    box-shadow:
      0 0 0 1px rgba(255,215,0,0.8),
      0 0 0 4px rgba(184,134,11,0.3),
      0 8px 48px rgba(255,200,0,0.65),
      0 2px 12px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    filter: brightness(1.08);
  }
  #play:active { transform: scale(0.97); }

  .start-specs {
    margin-top: 36px;
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
    opacity: 0.45;
  }
  .start-spec {
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 2px; color: #c7d0da;
  }

  /* ── CHAPTER CURTAIN — full-black cinematic transition ── */
  #curtain {
    position: fixed; inset: 0; background: #000;
    pointer-events: none; z-index: 18;
    opacity: 0; transition: opacity 0.45s ease;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    #hud { font-size: 10px; letter-spacing: 2.5px; left: 18px; top: 18px; }
    #cap { padding: 10px 16px; border-radius: 16px; bottom: max(env(safe-area-inset-bottom,16px),5%); }
    .start-title { font-size: 58px; }
    #play { padding: 15px 40px; font-size: 15px; }
    #replay { right: 16px; bottom: 16px; font-size: 12px; padding: 8px 16px; }
  }
  @media (min-width: 1400px) {
    #cap { font-size: 22px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
  <div id="prog"></div>
  <div id="curtain"></div>
  <div id="hud">VIDYUTHLABS · ANALYTEX</div>

  <div id="ch-overlay">
    <div id="ch-title"></div>
    <div id="ch-sub"></div>
  </div>

  <div id="cap"></div>
  <button id="replay">↺ &nbsp;REPLAY</button>

  <div id="start">
    <div class="start-eyebrow">VIDYUTHLABS PRESENTS</div>
    <div class="start-title">AnalyteX</div>
    <div class="start-rule"></div>
    <div class="start-desc">One device. Every threat. A cinematic walkthrough of the world's most versatile portable potentiostat.</div>
    <button id="play">▶ &nbsp; PLAY FILM</button>
    <div class="start-specs">
      <span class="start-spec">DPV · SWV · CA · CV</span>
      <span class="start-spec">WIFI · BT</span>
      <span class="start-spec">NanoX CARTRIDGES</span>
      <span class="start-spec">AI ANALYTICS</span>
    </div>
  </div>

  <audio id="vo" preload="auto" src="./vo_ryan.mp3"></audio>
  <audio id="music" preload="auto" src="./music.mp3" loop></audio>
  <script type="module" src="./main.js"></script>
</body>
</html>
