name: Deploy AnalyteX Film to Firebase Hosting

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Validate — lint HTML + JS, check file sizes
  # ──────────────────────────────────────────────────────────
  validate:
    name: Validate Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check critical files exist
        run: |
          for f in index.html main.js timeline.json vo.mp3 music.mp3 firebase.json vendor/three/build/three.module.js; do
            test -f "$f" || { echo "❌ missing $f"; exit 1; }
            echo "✅ $f"
          done

      - name: Check main.js syntax and size (< 200KB)
        run: |
          node --check main.js
          SIZE=$(wc -c < main.js)
          echo "main.js size: ${SIZE} bytes"
          [ "$SIZE" -le 204800 ] || { echo "❌ main.js exceeds 200KB"; exit 1; }

      - name: Check timeline.json
        run: node -e "const t=require('./timeline.json'); if(!(t.duration>0&&t.cues.length))process.exit(1); console.log('✅', t.cues.length, 'cues,', t.duration, 's')"

      - name: Check product claims
        run: node tools/check_claims.mjs

  # ──────────────────────────────────────────────────────────
  # JOB 2: Deploy — Firebase Hosting (only on push to main)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check for Firebase credentials
        id: sa
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not set; skipping Firebase deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        if: steps.sa.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.sa.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: steps.sa.outputs.ok == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        if: steps.sa.outputs.ok == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project vidyuthlabs-analytex

      - name: Post deployment URL
        if: steps.sa.outputs.ok == 'true'
        run: |
          echo "🚀 Deployed!"
          echo "🌐 Live URL: https://vidyuthlabs-analytex.web.app"

  # ──────────────────────────────────────────────────────────
  # JOB 3: Preview Deploy (on pull requests)
  # ──────────────────────────────────────────────────────────
  preview:
    name: Firebase Preview Deploy (PR)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check for Firebase credentials
        id: sa
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not set; skipping Firebase deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        if: steps.sa.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Deploy Preview Channel
        if: steps.sa.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vidyuthlabs-analytex
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
